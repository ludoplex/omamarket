# Generated by ci-kit/repo_ci_init.py (script-protocol) - CI-PROTOCOL baseline.
# Re-run repo_ci_init.py to refresh; edit freely afterwards but keep the checked properties
# (permissions, pinned actions, push+pull_request triggers, concurrency, timeouts, dependabot).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-standard:
    name: CI-PROTOCOL self-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository meets the CI/CD baseline
        run: python3 .github/ci-kit/repo_ci_check.py .

  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck every shell script
        run: git ls-files '*.sh' '*.bash' | xargs -r shellcheck -S warning
      - name: POSIX sh syntax
        run: git ls-files '*.sh' | xargs -r -n1 sh -n

